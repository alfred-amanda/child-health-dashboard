
[project]
name = "child-health-dashboard-api"
version = "0.1.0"
description = "Local-first child health dashboard backend for Thomas."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
strict = false
warn_return_any = false
warn_unused_ignores = false
exclude = [".venv", "build"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
